name: Docker CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build application image
        run: docker compose build app

      - name: Start containers
        run: docker compose up -d --no-build

      - name: Check application
        run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag my-python-app:compose austiantsev/docker-python-test:latest
          docker tag my-python-app:compose austiantsev/docker-python-test:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push austiantsev/docker-python-test:latest
          docker push austiantsev/docker-python-test:${{ github.sha }}

      - name: Stop containers
        if: always()
        run: docker compose down

  deploy:
    needs: build-and-test
    runs-on: [self-hosted, deploy]

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Update deployment files
        run: |
          cd ~/docker-python-deploy
          git pull --ff-only

      - name: Pull and deploy new image
        run: |
          cd ~/docker-python-deploy
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d

      - name: Check deployed application
        run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080        

